# Sveltia CMS configuration for Midwest Industrial Brokers
# https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: Drakefilippis/midwestindustrialbrokers-site
  branch: main
  # NOTE: base_url removed — use Personal Access Token sign-in for now.
  # When you deploy your own Cloudflare Worker (sveltia-cms-auth), add:
  #   base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Where uploaded images get stored in the repo
media_folder: "uploads"
public_folder: "/uploads"

# Default branch for edits is "main" — straight commits, no draft/review workflow
publish_mode: simple

# Site preview link in the CMS header
site_url: https://midwestindustrialbrokers.com
display_url: https://midwestindustrialbrokers.com

collections:
  - name: content
    label: "Site Content"
    label_singular: "Site Content"
    description: "Edit every dynamic section of midwestindustrialbrokers.com here."
    files:
      - name: data
        label: "All Site Content"
        file: "data.json"
        format: "json"
        fields:
          # ============ STATS STRIP ============
          - label: "Stats Strip (under hero)"
            name: "stats"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.value}}{{fields.unit}} — {{fields.label}}"
            fields:
              - { label: "Number", name: "value", widget: "string", hint: "e.g. $300, 14, 10,000" }
              - { label: "Unit", name: "unit", widget: "string", required: false, hint: "e.g. M+, +, B" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Auto count", name: "auto", widget: "select", required: false, options: ["markets"], hint: "Set to markets to show the number of market pages automatically" }

          # ============ SERVICES (listed in this order on the site) ============
          - label: "Services (in display order)"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Service", name: "title", widget: "string" }
              - { label: "URL slug (page lives at /services/slug/)", name: "slug", widget: "string", hint: "lowercase with hyphens, like tenant-representation. Deals use this slug in their Services field." }
              - { label: "Card text (homepage)", name: "description", widget: "text" }
              - { label: "Page headline", name: "headline", widget: "string", required: false }
              - label: "Form default for I want to"
                name: "need"
                widget: "select"
                required: false
                options: ["Lease space", "Lease out my building", "Buy a property", "Sell a property", "Build-to-suit", "Something else"]
              - { label: "Overview paragraphs", name: "overview", widget: "list", required: false, field: { label: "Paragraph", name: "text", widget: "text" } }
              - label: "Process steps"
                name: "steps"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Step", name: "title", widget: "string" }
                  - { label: "Detail", name: "text", widget: "text" }
              - { label: "Who it is for", name: "who", widget: "list", required: false, field: { label: "Item", name: "text", widget: "string" } }

          # ============ COVERAGE CITIES (yellow strip) ============
          - label: "Coverage Cities (yellow strip)"
            name: "coverage_cities"
            widget: "list"
            field: { label: "City", name: "city", widget: "string" }

          # ============ TEAM ============
          - label: "Team / Brokers"
            name: "team"
            widget: "list"
            summary: "{{fields.name}} — {{fields.title}}"
            fields:
              - { label: "Full name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Initials (for avatar)", name: "initials", widget: "string" }
              - { label: "Headshot (square, at least 600px; initials show if empty)", name: "photo", widget: "image", required: false }
              - { label: "Bio (HTML allowed)", name: "bio_html", widget: "text" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Office phone", name: "office_phone", widget: "string", required: false }
              - { label: "Mobile phone", name: "mobile_phone", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string", required: false }

          # ============ CLOSED DEALS (with case studies) ============
          - label: "Closed Deals"
            name: "closed_deals"
            widget: "list"
            summary: "{{fields.year}} · {{fields.property}} — {{fields.client}}"
            fields:
              - label: "URL slug (kebab-case, no spaces)"
                name: "slug"
                widget: "string"
                required: false
                hint: "Leave empty for a card-only deal (no deal page, card not clickable). Becomes the URL: /deal.html?slug=YOUR-SLUG-HERE. Example: bank-supplies-saline"
              - label: "Year"
                name: "year"
                widget: "select"
                options: ["2023", "2024", "2025", "2026", "2027"]
              - { label: "Property (address or portfolio name)", name: "property", widget: "string" }
              - { label: "Subtitle (city, context)", name: "subtitle", widget: "string", required: false }
              - { label: "Street address (shown on card)", name: "address", widget: "string", required: false }
              - { label: "Card location override (optional, e.g. 4-building portfolio)", name: "city", widget: "string", required: false }
              - { label: "Client name (only if approved to publish)", name: "client", widget: "string", required: false }
              - { label: "Price or rate on card (only if cleared to release, e.g. $1,965,000 or $9.05/SF/yr NNN)", name: "price", widget: "string", required: false }
              - { label: "Property type (shown on card, e.g. Manufacturing, Warehouse, Flex, Retail, Office, Land)", name: "property_type", widget: "string", required: false }
              - { label: "Client industry", name: "client_industry", widget: "string", required: false }
              - label: "Side represented"
                name: "side"
                widget: "select"
                options: ["Buyer", "Seller", "Tenant", "Landlord", "Both"]
              - { label: "Deal type", name: "deal_type", widget: "string", hint: "e.g. Sale, Lease NNN, Investment Sale" }
              - label: "Services (shows this deal on those service pages)"
                name: "services"
                widget: "select"
                multiple: true
                required: false
                options:
                  - { label: "Disposition", value: "disposition" }
                  - { label: "Acquisition", value: "acquisition" }
                  - { label: "Build-to-Suit", value: "build-to-suit" }
                  - { label: "Tenant Representation", value: "tenant-representation" }
                  - { label: "Buyer Representation", value: "buyer-representation" }
                  - { label: "Landlord Representation", value: "landlord-representation" }
                  - { label: "Investment Sales", value: "investment-sales" }
              - { label: "Size or value", name: "size", widget: "string", hint: "e.g. 175,000 SF or $2,400,000" }
              - { label: "Closed date", name: "closed_date", widget: "string", required: false, hint: "e.g. April 17, 2026" }
              - { label: "Case study headline (shown at top of case study page)", name: "headline", widget: "string", required: false }
              - { label: "Short summary (1–2 sentences, shown under headline)", name: "summary", widget: "text", required: false }
              - label: "Full case study body (markdown — use ## for subheads, ** for bold)"
                name: "body_md"
                widget: "markdown"
                required: false
                buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
              - label: "Deal details (sidebar — leave blank to hide)"
                name: "deal_details"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Clear height", name: "clear_height", widget: "string", required: false }
                  - { label: "Dock doors", name: "dock_doors", widget: "string", required: false }
                  - { label: "Office finish", name: "office_finish", widget: "string", required: false }
                  - { label: "Acreage", name: "acreage", widget: "string", required: false }
                  - { label: "Asking price", name: "asking_price", widget: "string", required: false }
                  - { label: "Sale price", name: "sale_price", widget: "string", required: false }
              - label: "Testimonial (sidebar — leave blank to hide)"
                name: "testimonial"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", required: false }
                  - { label: "Attribution (name, title)", name: "attribution", widget: "string", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                field: { label: "Photo", name: "url", widget: "image" }

          # ============ CLIENT LOGO STRIP (under the hero) ============
          - label: "Client Logo Strip (only real clients)"
            name: "client_logos"
            widget: "list"
            hint: "Only add companies you have actually represented. Upload a white version for the dark band and a color version for hover."
            summary: "{{fields.name}}"
            fields:
              - { label: "Company name (used as alt text)", name: "name", widget: "string" }
              - { label: "Logo, white version", name: "logo", widget: "image" }
              - { label: "Logo, color version (shown on hover)", name: "logo_color", widget: "image", required: false }
              - { label: "Hover tile color", name: "hover_bg", widget: "string", required: false, hint: "Example: #ffffff" }
              - { label: "Website link (leave blank for no link)", name: "url", widget: "string", required: false }

          # ============ ACTIVE LISTINGS (cards, data from CPIX) ============
          - label: "Active Listings settings"
            name: "listings_settings"
            widget: "object"
            collapsed: true
            fields:
              - { label: "CPIX link for all listings", name: "cpix_url", widget: "string" }
              - { label: "Cards on the homepage", name: "home_limit", widget: "number", value_type: "int" }
              - { label: "Last synced from CPIX", name: "last_synced", widget: "string", required: false }
          - label: "Active Listings (cards)"
            name: "listings"
            widget: "list"
            summary: "{{fields.title}} · {{fields.deal_type}} · {{fields.size}}"
            hint: "Copy details from CPIX. Turn off Show when a listing is leased or sold."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Full address", name: "address", widget: "string", hint: "Street, City, MI ZIP. The city is used to place the listing on market pages." }
              - label: "Type"
                name: "deal_type"
                widget: "select"
                options: ["Lease", "Sale", "Sale/Lease"]
              - { label: "Use", name: "use", widget: "string", required: false, hint: "Industrial, Office, Land..." }
              - { label: "Size", name: "size", widget: "string", required: false }
              - { label: "Lot", name: "lot", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "CPIX listing link", name: "url", widget: "string" }
              - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false }
              - { label: "Show on site", name: "show", widget: "boolean", default: true }

          # ============ MARKET PAGES ============
          - label: "Market Pages"
            name: "markets"
            widget: "list"
            summary: "{{fields.name}} (/markets/{{fields.slug}}/)"
            hint: "Each market gets its own page. Closed deals and listings show up automatically when their city matches."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Full name (used in the headline)", name: "full_name", widget: "string" }
              - { label: "URL slug", name: "slug", widget: "string", hint: "lowercase with hyphens, like plymouth-mi" }
              - { label: "Cities that belong to this market", name: "cities", widget: "list", field: { label: "City", name: "city", widget: "string" } }
              - { label: "Page title (search results)", name: "title", widget: "string" }
              - { label: "Meta description", name: "meta", widget: "text" }
              - { label: "Short summary (homepage card)", name: "summary", widget: "string" }
              - { label: "Intro paragraphs", name: "intro", widget: "list", field: { label: "Paragraph", name: "text", widget: "text" } }

          # ============ FAQ ============
          - label: "FAQ"
            name: "faqs"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text" }

          # ============ ANALYTICS ============
          - label: "Analytics"
            name: "analytics"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Google Analytics 4 measurement ID", name: "ga4_measurement_id", widget: "string", required: false, hint: "Looks like G-XXXXXXXXXX. Leave blank to turn analytics off." }

          # ============ MARKET REPORT ============
          - label: "Market Report"
            name: "market_report"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Quarter label", name: "quarter_label", widget: "string", hint: "e.g. Q2 2026 · Detroit Industrial" }
              - { label: "Market headline", name: "headline", widget: "text" }
              - label: "Headline stats (6 tiles)"
                name: "stats"
                widget: "list"
                summary: "{{fields.label}} — {{fields.value}}{{fields.unit}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value (number)", name: "value", widget: "string" }
                  - { label: "Unit", name: "unit", widget: "string", required: false }
                  - { label: "Trend text", name: "trend", widget: "string", required: false }
                  - label: "Direction (controls color)"
                    name: "direction"
                    widget: "select"
                    options: ["up", "down", "flat"]
              - label: "Submarket snapshot table"
                name: "submarkets"
                widget: "list"
                summary: "{{fields.name}} — Vac {{fields.vacancy}} · NNN {{fields.nnn}}"
                fields:
                  - { label: "Submarket name", name: "name", widget: "string" }
                  - { label: "Vacancy", name: "vacancy", widget: "string" }
                  - { label: "Avg. NNN", name: "nnn", widget: "string" }
                  - { label: "YoY change", name: "yoy", widget: "string" }
                  - label: "YoY color"
                    name: "yoy_color"
                    widget: "select"
                    options: ["green", "red", "gray"]
              - { label: "Data note (small italic line)", name: "data_note", widget: "string", required: false }
              - label: "Key takeaways (bulleted list)"
                name: "takeaways"
                widget: "list"
                field: { label: "Takeaway", name: "text", widget: "text" }
              - { label: "What We're Watching — title", name: "watching_title", widget: "string", required: false }
              - { label: "What We're Watching — body", name: "watching_body", widget: "text", required: false }

          # ============ PREFERRED SERVICES ============
          - label: "Preferred Services (vendor network)"
            name: "preferred_services"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Subtitle (specialties)", name: "subtitle", widget: "string", required: false }
              - label: "Contacts"
                name: "contacts"
                widget: "list"
                summary: "{{fields.name}} — {{fields.firm}}"
                fields:
                  - { label: "Contact name", name: "name", widget: "string", required: false }
                  - { label: "Firm name", name: "firm", widget: "string", required: false }
                  - { label: "Phone", name: "phone", widget: "string", required: false }
                  - { label: "Email", name: "email", widget: "string", required: false }
